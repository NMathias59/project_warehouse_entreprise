version: 2

sources:
  - name: procurement
    description: >
      Source Procurement — données achats et fournisseurs depuis DB_WH_PROCUREMENT
      (fournisseurs, contacts, appels d'offres, contrats, bons de commande, réceptions, évaluations fournisseurs).
    schema: DB_WH_PROCUREMENT

    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: _airbyte_extracted_at

    tables:
      - name: suppliers
      - name: supplier_contacts
      - name: rfqs
      - name: rfq_lines
      - name: rfq_responses
      - name: contracts
      - name: contract_lines
      - name: purchase_orders
      - name: purchase_order_lines
      - name: receipts
      - name: receipt_lines
      - name: supplier_evaluations
