version: 2

sources:
  - name: crm
    description: >
      Source CRM — données commerciales depuis le data warehouse DB_WH_CRM
      (comptes, contacts, opportunités, activités, pipeline de vente, tâches).
    schema: DB_WH_CRM

    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: _airbyte_extracted_at

    tables:
      - name: accounts
      - name: activities
      - name: contacts
      - name: opportunities
      - name: pipeline_events
      - name: sales_reps
      - name: tasks
