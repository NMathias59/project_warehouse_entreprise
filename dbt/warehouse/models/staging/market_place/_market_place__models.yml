version: 2

# Staging models — source marketplace (DB_WH_MKT).
# Matérialisation : view (héritée de dbt_project.yml §staging).
# Tests minimaux : unique + not_null sur la clé Airbyte CDC (_airbyte_raw_id),
# not_null sur la clé métier (_id).

models:
