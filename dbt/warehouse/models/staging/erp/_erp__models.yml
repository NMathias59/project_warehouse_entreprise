version: 2

# Staging models pour la source ERP (DB_WH_ERP).
# Convention : stg_erp__<table>.sql — 1-to-1 avec la table source.
# Matérialisation : view (héritée de dbt_project.yml).

models:
  - name: stg_erp__accounting_periods
    description: "{{ doc('stg_erp__accounting_periods') }}"
    columns:
      - name: id
        description: "Identifiant unique de la période comptable (PK)."
        tests:
          - unique
          - not_null
      - name: id_accounting_period
        description: "Alias de l'identifiant de la période comptable."
      - name: label
        description: "Libellé de la période comptable."
      - name: ends_at
        description: "Date de fin de la période."
      - name: is_closed
        description: "Indique si la période est clôturée (booléen)."
      - name: starts_at
        description: "Date de début de la période."
      - name: created_at
        description: "Date de création de la période."
      - name: fiscal_year_id
        description: "Identifiant de l'exercice fiscal associé."
  - name: stg_erp__bank_accounts
    description: "{{ doc('stg_erp__bank_accounts') }}"
    columns:
      - name: id
        description: "Identifiant unique du compte bancaire (PK)."
        tests:
          - unique
          - not_null
      - name: id_bank_account
        description: "Alias de l'identifiant du compte bancaire."
      - name: bic
        description: "Code BIC de la banque."
      - name: iban
        description: "Numéro IBAN du compte."
      - name: name
        description: "Nom du compte bancaire."
      - name: currency
        description: "Devise du compte."
      - name: is_active
        description: "Indique si le compte est actif (booléen)."
      - name: created_at
        description: "Date de création du compte."
  - name: stg_erp__bank_reconciliations
    description: "{{ doc('stg_erp__bank_reconciliations') }}"
    columns:
      - name: id_bank_reconciliation
        description: "Identifiant unique de la réconciliation bancaire (PK)."
        tests:
          - unique
          - not_null
      - name: reconciled_at
        description: "Date et heure de réconciliation (timestamp)."
      - name: reconciled_by
        description: "Utilisateur ayant effectué la réconciliation."
      - name: bank_account_id
        description: "Référence du compte bancaire lié."
      - name: bank_transaction_id
        description: "Référence de la transaction bancaire réconciliée."
      - name: journal_entry_line_id
        description: "Référence de la ligne d'écriture comptable liée."
  - name: stg_erp__bank_transactions
    description: "{{ doc('stg_erp__bank_transactions') }}"
    columns:
      - name: id_bank_transaction
        description: "Identifiant unique de la transaction bancaire (PK)."
        tests:
          - unique
          - not_null
      - name: amount
        description: "Montant de la transaction (decimal)."
      - name: balance
        description: "Solde après transaction (decimal)."
      - name: reference
        description: "Référence externe de la transaction."
      - name: value_date
        description: "Date de valeur de la transaction."
      - name: description
        description: "Description de la transaction."
      - name: imported_at
        description: "Horodatage d'import dans le système."
      - name: is_reconciled
        description: "Indique si la transaction est réconciliée (booléen)."
      - name: bank_account_id
        description: "Référence du compte bancaire."
      - name: transaction_date
        description: "Date de la transaction."
  - name: stg_erp__bom_headers
    description: "{{ doc('stg_erp__bom_headers') }}"
    columns:
      - name: id_bom_header
        description: "Identifiant unique de l'en-tête nomenclature (PK)."
        tests:
          - unique
          - not_null
      - name: notes
        description: "Notes associées à la nomenclature."
      - name: version
        description: "Version de la nomenclature."
      - name: created_at
        description: "Date de création."
      - name: is_current
        description: "Indique si cette version est la version courante (booléen)."
      - name: pc_model_id
        description: "Référence du modèle PC associé."
  - name: stg_erp__bom_lines
    description: "{{ doc('stg_erp__bom_lines') }}"
    columns:
      - name: id_bom_line
        description: "Identifiant unique de la ligne de nomenclature (PK)."
        tests:
          - unique
          - not_null
      - name: notes
        description: "Notes sur la ligne."
      - name: position
        description: "Position / ordre dans la nomenclature (int)."
      - name: quantity
        description: "Quantité du composant dans la nomenclature (decimal)."
      - name: component_id
        description: "Référence du composant."
      - name: bom_header_id
        description: "Référence de l'en-tête nomenclature parent."
  - name: stg_erp__bom_versions
    description: "{{ doc('stg_erp__bom_versions') }}"
    columns:
      - name: id_bom_version
        description: "Identifiant unique de la version de nomenclature (PK)."
        tests:
          - unique
          - not_null
      - name: snapshot
        description: "Snapshot JSON de la nomenclature à cette version."
      - name: changelog
        description: "Description des changements apportés."
      - name: created_at
        description: "Date de création de la version."
      - name: created_by
        description: "Utilisateur ayant créé la version."
      - name: version_label
        description: "Label lisible de la version (ex: v1.2)."
  - name: stg_erp__brands
    description: "{{ doc('stg_erp__brands') }}"
    columns:
      - name: id_brand
        description: "Identifiant unique de la marque (PK)."
        tests:
          - unique
          - not_null
      - name: name
        description: "Nom de la marque."
      - name: slug
        description: "Slug unique pour la marque."
      - name: country
        description: "Pays d'origine de la marque."
      - name: created_at
        description: "Date de création de la marque."
      - name: deleted_at
        description: "Date de suppression (soft delete)."
      - name: updated_at
        description: "Date de dernière modification."
      - name: logo_url
        description: "URL du logo de la marque."
  - name: stg_erp__budget_lines
    description: "{{ doc('stg_erp__budget_lines') }}"
    columns:
      - name: id_budget_line
        description: "Identifiant unique de la ligne de budget (PK)."
        tests:
          - unique
          - not_null
      - name: budget_id
        description: "Référence du budget parent."
      - name: notes
        description: "Notes / commentaires sur la ligne."
      - name: amount
        description: "Montant budgété (decimal)."
      - name: created_at
        description: "Date de création."
      - name: account_number
        description: "Numéro de compte associé à la ligne."
  - name: stg_erp__budgets
    description: "{{ doc('stg_erp__budgets') }}"
    columns:
      - name: id_budget
        description: "Identifiant unique du budget (PK)."
        tests:
          - unique
          - not_null
      - name: label
        description: "Libellé du budget."
      - name: version
        description: "Version du budget."
      - name: is_active
        description: "Indique si le budget est actif."
      - name: created_at
        description: "Date de création du budget."
      - name: cost_center_id
        description: "Référence du centre de coût associé."
      - name: fiscal_year_id
        description: "Référence de l'exercice fiscal."
  - name: stg_erp__categories
    description: "{{ doc('stg_erp__categories') }}"
    columns:
      - name: id_category
        description: "Identifiant unique de la catégorie (PK)."
        tests:
          - unique
          - not_null
      - name: name
        description: "Nom de la catégorie."
      - name: slug
        description: "Slug unique de la catégorie."
      - name: parent_id
        description: "Référence de la catégorie parente (si applicable)."
      - name: created_at
        description: "Date de création."
      - name: deleted_at
        description: "Date de suppression (soft delete)."
      - name: updated_at
        description: "Date de dernière modification."
      - name: description
        description: "Description longue de la catégorie."
  - name: stg_erp__chart_of_accounts
