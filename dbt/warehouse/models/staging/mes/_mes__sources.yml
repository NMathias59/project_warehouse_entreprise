version: 2

sources:
  - name: mes
    description: >
      Source MES — données de pilotage de la production depuis DB_WH_MES
      (postes de travail, équipes, ordres de fabrication, opérations, pointages, consommations, défauts, arrêts machine).
    schema: DB_WH_MES

    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: _airbyte_extracted_at

    tables:
      - name: work_centers
      - name: shifts
        identifier: work_centers
      - name: production_orders
      - name: production_operations
        identifier: operations
      - name: time_records
        identifier: job_card_events
      - name: material_consumptions
        identifier: material_issues
      - name: defects
      - name: machine_downtime
        identifier: downtime_events
