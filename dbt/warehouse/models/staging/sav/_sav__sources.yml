version: 2

sources:
  - name: sav
    description: >
      Source SAV — données du service après-vente depuis DB_WH_SAV
      (techniciens, tickets, messages, historique, interventions, pièces détachées, garanties, satisfaction client).
    schema: DB_WH_SAV

    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: _airbyte_extracted_at

    tables:
      - name: technicians
      - name: tickets
      - name: ticket_messages
      - name: ticket_history
      - name: interventions
      - name: spare_parts_used
      - name: warranties
      - name: customer_satisfaction
