      - name: label
        description: "Libellé du compte."
      - name: is_active
        description: "Indique si le compte est actif (booléen)."
      - name: parent_id
        description: "Référence du compte parent (hiérarchie)."
      - name: created_at
        description: "Date de création."
      - name: account_type
