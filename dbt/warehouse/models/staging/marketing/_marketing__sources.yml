version: 2

sources:
  - name: marketing
    description: >
      Source Marketing — données des campagnes et actions marketing depuis DB_WH_MARKETING
      (campagnes, leads, envois email, événements email, performances publicitaires, liens UTM, audiences).
    schema: DB_WH_MARKETING

    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: _airbyte_extracted_at

    tables:
      - name: campaigns
      - name: leads
        identifier: audiences
      - name: email_sends
        identifier: sends
      - name: email_events
        identifier: send_events
      - name: ad_performance
        identifier: campaigns
      - name: utm_links
        identifier: campaigns
      - name: audiences
