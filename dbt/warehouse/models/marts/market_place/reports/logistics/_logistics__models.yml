version: 2

models:

  - name: rpt_mkt__logistics_performance
    description: >
      Suivi des expéditions enrichi des données commande et métriques délai end-to-end.
      Grain : une expédition par ligne (shipment_id).
      Usage BI : performance transporteurs, délais livraison, SLA, taux de retour.
    columns:
      - name: shipment_id
        description: Clé primaire — identifiant de l'expédition.
        data_tests:
          - not_null
          - unique
      - name: carrier_name
        description: Nom du transporteur.
      - name: fulfillment_days
        description: Jours entre la commande et l'expédition.
      - name: transit_days
        description: Jours entre l'expédition et la livraison.
      - name: total_delivery_days
        description: Jours entre la commande et la livraison (end-to-end).
      - name: is_delivered
        description: 1 si le colis a été livré (shipment_delivered_at non null).
      - name: is_returned
        description: 1 si le statut est returned.
      - name: shipment_month
        description: Mois d'expédition au format YYYYMM.

  - name: rpt_mkt__carrier_performance
    description: >
      Performance par transporteur — une ligne par carrier.
      Combine les métriques d'expédition (taux de livraison, délai moyen, retours)
      avec les événements de tracking (couverture tracking, taux d'exceptions).
      Usage BI : évaluation et comparaison des transporteurs, pilotage SLA livraison.
    columns:
      - name: shipment_carrier_id
        description: "PK — identifiant du transporteur."
        tests:
          - unique
          - not_null
      - name: carrier_name
        description: "Nom du transporteur."
      - name: total_shipments
        description: "Nombre total d'expéditions confiées à ce transporteur."
      - name: delivered_count
        description: "Nombre d'expéditions livrées."
      - name: delivery_rate_pct
        description: "Taux de livraison en % (delivered / total)."
      - name: return_rate_pct
        description: "Taux de retour en % (returned / total)."
      - name: avg_transit_days
        description: "Délai moyen de transit en jours (shipped → delivered)."
      - name: tracking_coverage_pct
        description: "% d'expéditions avec au moins un événement de tracking."
      - name: exception_rate_pct
        description: "% d'événements de tracking de type exception (incidents)."
