    description: "{{ doc('stg_erp__accounting_periods') }}"
    columns:
      - name: id
        description: "Identifiant unique de la période comptable (PK)."
        tests:
          - unique
          - not_null
      - name: id_accounting_period
        description: "Alias de l'identifiant de la période comptable."
