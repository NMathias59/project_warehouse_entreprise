version: 2

sources:
  - name: wms
    description: >
      Source WMS — données de gestion d'entrepôt depuis DB_WH_WMS
      (emplacements, mouvements de stock, réceptions, expéditions, prélèvements, ajustements d'inventaire).
    schema: DB_WH_WMS

    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: _airbyte_extracted_at

    tables:
      - name: locations
      - name: receipts
      - name: receipt_lines
      - name: picking_orders
        identifier: pick_orders
      - name: picking_lines
        identifier: pick_order_lines
      - name: shipments
        identifier: transfer_orders
      - name: shipment_lines
        identifier: transfer_order_lines
      - name: stock_movements
        identifier: inventory_positions
      - name: inventory_adjustments
        identifier: cycle_count_lines
