version: 2

sources:
  - name: sirh
    description: >
      Source SIRH — données RH depuis DB_WH_SIRH
      (départements, postes, collaborateurs, contrats, fiches de paie, absences, formations, évaluations de performance).
    schema: DB_WH_SIRH

    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}
    loaded_at_field: _airbyte_extracted_at

    tables:
      - name: departments
      - name: positions
      - name: employees
      - name: contracts
        identifier: employees
      - name: payslips
        identifier: payroll
      - name: payslip_lines
        identifier: payroll
      - name: absence_types
        identifier: leave_requests
      - name: absences
        identifier: leave_requests
      - name: training_sessions
        identifier: training_courses
      - name: training_enrollments
      - name: performance_reviews
